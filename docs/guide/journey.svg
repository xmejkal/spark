<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2792" width="1600" height="2792" font-family="&apos;Noto Sans&apos;, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif">
<title>The spark journey: eight steps from an idea to a working gadget, and how far each works today</title>
<rect width="1600" height="2792" rx="24" fill="#ffffff"/>
<text x="48" y="96" font-size="44" font-weight="bold" fill="#1a1a1a" text-anchor="start">From an idea to a working gadget</text>
<text x="48" y="140" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">The spark journey, and how far each step worked in the runs up to 2026-11-01.</text>
<circle cx="58" cy="180" r="10" fill="#2dc75c"/>
<text x="78" y="188" font-size="22" font-weight="normal" fill="#595959" text-anchor="start">works: it ran end to end for the docs</text>
<circle cx="547" cy="180" r="10" fill="#ffdc4a"/>
<text x="567" y="188" font-size="22" font-weight="normal" fill="#595959" text-anchor="start">partly: it stops before its goal, or part of it was not run</text>
<line x1="227" y1="276" x2="1373" y2="276" stroke="#b0b0b0" stroke-width="4"/>
<circle cx="227" cy="276" r="36" fill="#ffdc4a"/>
<text x="227" y="287" font-size="30" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>
<text x="227" y="358" font-size="30" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Drawer</text>
<text x="227" y="390" font-size="22" font-weight="normal" fill="#595959" text-anchor="middle">/spark:drawer</text>
<rect x="48" y="412" width="358" height="996" rx="12" fill="#f0f5fd"/>
<text x="68" y="452" font-size="20" font-weight="bold" fill="#305bab" text-anchor="start">You do</text>
<text x="68" y="486" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">Say which parts you own.</text>
<text x="68" y="564" font-size="20" font-weight="bold" fill="#305bab" text-anchor="start">You get</text>
<text x="68" y="598" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">Your drawer, kept in your</text>
<text x="68" y="632" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">own store.</text>
<rect x="68" y="696" width="96" height="36" rx="18" fill="#fff6b6"/>
<text x="116" y="721" font-size="20" font-weight="bold" fill="#af7e04" text-anchor="middle">partly</text>
<text x="68" y="766" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">Listing and writing entries</text>
<text x="68" y="800" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">ran. Your words to entries,</text>
<text x="68" y="834" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">and the DFRobot import, did</text>
<text x="68" y="868" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">not.</text>
<circle cx="609" cy="276" r="36" fill="#ffdc4a"/>
<text x="609" y="287" font-size="30" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2</text>
<text x="609" y="358" font-size="30" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Idea</text>
<text x="609" y="390" font-size="22" font-weight="normal" fill="#595959" text-anchor="middle">/spark:idea</text>
<rect x="430" y="412" width="358" height="996" rx="12" fill="#f0f5fd"/>
<text x="450" y="452" font-size="20" font-weight="bold" fill="#305bab" text-anchor="start">You do</text>
<text x="450" y="486" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">Describe the gadget in your</text>
<text x="450" y="520" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">own words.</text>
<text x="450" y="564" font-size="20" font-weight="bold" fill="#305bab" text-anchor="start">You get</text>
<text x="450" y="598" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">Needs matched to your</text>
<text x="450" y="632" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">drawer, a part per need,</text>
<text x="450" y="666" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">and a requirements file.</text>
<rect x="450" y="696" width="96" height="36" rx="18" fill="#fff6b6"/>
<text x="498" y="721" font-size="20" font-weight="bold" fill="#af7e04" text-anchor="middle">partly</text>
<text x="450" y="766" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">The scripts ran from needs</text>
<text x="450" y="800" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">to a requirements file. A</text>
<text x="450" y="834" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">board offers its own parts</text>
<text x="450" y="868" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">for a need, and says what a</text>
<text x="450" y="902" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">run cannot test of them.</text>
<text x="450" y="936" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">The conversation was not</text>
<text x="450" y="970" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">run.</text>
<circle cx="991" cy="276" r="36" fill="#ffdc4a"/>
<text x="991" y="287" font-size="30" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3</text>
<text x="991" y="358" font-size="30" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Research</text>
<text x="991" y="390" font-size="22" font-weight="normal" fill="#595959" text-anchor="middle">/spark:research</text>
<rect x="812" y="412" width="358" height="996" rx="12" fill="#f0f5fd"/>
<text x="832" y="452" font-size="20" font-weight="bold" fill="#305bab" text-anchor="start">You do</text>
<text x="832" y="486" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">Pick a part for a real gap.</text>
<text x="832" y="564" font-size="20" font-weight="bold" fill="#305bab" text-anchor="start">You get</text>
<text x="832" y="598" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">A part record with a source</text>
<text x="832" y="632" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">for every fact.</text>
<rect x="832" y="696" width="96" height="36" rx="18" fill="#fff6b6"/>
<text x="880" y="721" font-size="20" font-weight="bold" fill="#af7e04" text-anchor="middle">partly</text>
<text x="832" y="766" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">The library search runs.</text>
<text x="832" y="800" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">Research by agents was not</text>
<text x="832" y="834" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">run.</text>
<circle cx="1373" cy="276" r="36" fill="#2dc75c"/>
<text x="1373" y="287" font-size="30" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4</text>
<text x="1373" y="358" font-size="30" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Build</text>
<text x="1373" y="390" font-size="22" font-weight="normal" fill="#595959" text-anchor="middle">/spark:build</text>
<rect x="1194" y="412" width="358" height="996" rx="12" fill="#f0f5fd"/>
<text x="1214" y="452" font-size="20" font-weight="bold" fill="#305bab" text-anchor="start">You do</text>
<text x="1214" y="486" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">Run it on the requirements</text>
<text x="1214" y="520" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">file.</text>
<text x="1214" y="564" font-size="20" font-weight="bold" fill="#305bab" text-anchor="start">You get</text>
<text x="1214" y="598" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">A board that builds, a</text>
<text x="1214" y="632" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">Wokwi diagram, a sheet, a</text>
<text x="1214" y="666" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">page of tabs.</text>
<rect x="1214" y="696" width="96" height="36" rx="18" fill="#adf0c7"/>
<text x="1262" y="721" font-size="20" font-weight="bold" fill="#067429" text-anchor="middle">works</text>
<text x="1214" y="766" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">Ran end to end on</text>
<text x="1214" y="800" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">2026-10-11. Drawn on a half</text>
<text x="1214" y="834" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">breadboard for the XIAO C6</text>
<text x="1214" y="868" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">(a Wokwi diagram). A</text>
<text x="1214" y="902" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">picture alone for the</text>
<text x="1214" y="936" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">FireBeetle 2 S3, from its</text>
<text x="1214" y="970" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">record, 2026-10-29. The</text>
<text x="1214" y="1004" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">page of tabs ran,</text>
<text x="1214" y="1038" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">2026-10-16. A moved part,</text>
<text x="1214" y="1072" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">jumper or resistor is kept,</text>
<text x="1214" y="1106" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">2026-10-18. The library's</text>
<text x="1214" y="1140" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">XIAO record builds button +</text>
<text x="1214" y="1174" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">LED, 2026-10-18.</text>
<line x1="227" y1="1488" x2="1373" y2="1488" stroke="#b0b0b0" stroke-width="4"/>
<circle cx="227" cy="1488" r="36" fill="#2dc75c"/>
<text x="227" y="1499" font-size="30" font-weight="bold" fill="#1a1a1a" text-anchor="middle">5</text>
<text x="227" y="1570" font-size="30" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Checks</text>
<text x="227" y="1602" font-size="22" font-weight="normal" fill="#595959" text-anchor="middle">check_all.py</text>
<rect x="48" y="1624" width="358" height="996" rx="12" fill="#f0f5fd"/>
<text x="68" y="1664" font-size="20" font-weight="bold" fill="#305bab" text-anchor="start">You do</text>
<text x="68" y="1698" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">Run the checks on the</text>
<text x="68" y="1732" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">project.</text>
<text x="68" y="1776" font-size="20" font-weight="bold" fill="#305bab" text-anchor="start">You get</text>
<text x="68" y="1810" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">What holds, and what a</text>
<text x="68" y="1844" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">check could not look at.</text>
<rect x="68" y="1908" width="96" height="36" rx="18" fill="#adf0c7"/>
<text x="116" y="1933" font-size="20" font-weight="bold" fill="#067429" text-anchor="middle">works</text>
<text x="68" y="1978" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">A fresh button-and-LED</text>
<text x="68" y="2012" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">project passes.</text>
<circle cx="609" cy="1488" r="36" fill="#ffdc4a"/>
<text x="609" y="1499" font-size="30" font-weight="bold" fill="#1a1a1a" text-anchor="middle">6</text>
<text x="609" y="1570" font-size="30" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Firmware</text>
<text x="609" y="1602" font-size="22" font-weight="normal" fill="#595959" text-anchor="middle">import_firmware.py</text>
<rect x="430" y="1624" width="358" height="996" rx="12" fill="#f0f5fd"/>
<text x="450" y="1664" font-size="20" font-weight="bold" fill="#305bab" text-anchor="start">You do</text>
<text x="450" y="1698" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">Write the firmware with</text>
<text x="450" y="1732" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">Claude.</text>
<text x="450" y="1776" font-size="20" font-weight="bold" fill="#305bab" text-anchor="start">You get</text>
<text x="450" y="1810" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">A pin map that the firmware</text>
<text x="450" y="1844" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">imports.</text>
<rect x="450" y="1908" width="96" height="36" rx="18" fill="#fff6b6"/>
<text x="498" y="1933" font-size="20" font-weight="bold" fill="#af7e04" text-anchor="middle">partly</text>
<text x="450" y="1978" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">The import passes on a Mac.</text>
<text x="450" y="2012" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">No check yet that it drives</text>
<text x="450" y="2046" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">every signal.</text>
<circle cx="991" cy="1488" r="36" fill="#2dc75c"/>
<text x="991" y="1499" font-size="30" font-weight="bold" fill="#1a1a1a" text-anchor="middle">7</text>
<text x="991" y="1570" font-size="30" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Simulate</text>
<text x="991" y="1602" font-size="22" font-weight="normal" fill="#595959" text-anchor="middle">run_scenario.py</text>
<rect x="812" y="1624" width="358" height="996" rx="12" fill="#f0f5fd"/>
<text x="832" y="1664" font-size="20" font-weight="bold" fill="#305bab" text-anchor="start">You do</text>
<text x="832" y="1698" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">Say in words what must</text>
<text x="832" y="1732" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">happen.</text>
<text x="832" y="1776" font-size="20" font-weight="bold" fill="#305bab" text-anchor="start">You get</text>
<text x="832" y="1810" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">The firmware running in</text>
<text x="832" y="1844" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">Wokwi, with a dated log.</text>
<rect x="832" y="1908" width="96" height="36" rx="18" fill="#adf0c7"/>
<text x="880" y="1933" font-size="20" font-weight="bold" fill="#067429" text-anchor="middle">works</text>
<text x="832" y="1978" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">The button-and-LED project</text>
<text x="832" y="2012" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">passed on 2026-10-12. A</text>
<text x="832" y="2046" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">board-only FireBeetle 2 S3</text>
<text x="832" y="2080" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">build wires its own LED and</text>
<text x="832" y="2114" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">button, 2026-11-01.</text>
<circle cx="1373" cy="1488" r="36" fill="#ffdc4a"/>
<text x="1373" y="1499" font-size="30" font-weight="bold" fill="#1a1a1a" text-anchor="middle">8</text>
<text x="1373" y="1570" font-size="30" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Bench</text>
<text x="1373" y="1602" font-size="22" font-weight="normal" fill="#595959" text-anchor="middle">look.py, deploy.py, live.py</text>
<rect x="1194" y="1624" width="358" height="996" rx="12" fill="#f0f5fd"/>
<text x="1214" y="1664" font-size="20" font-weight="bold" fill="#305bab" text-anchor="start">You do</text>
<text x="1214" y="1698" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">Wire the breadboard and</text>
<text x="1214" y="1732" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">flash the board.</text>
<text x="1214" y="1776" font-size="20" font-weight="bold" fill="#305bab" text-anchor="start">You get</text>
<text x="1214" y="1810" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">The tested firmware on the</text>
<text x="1214" y="1844" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">real board.</text>
<rect x="1214" y="1908" width="96" height="36" rx="18" fill="#fff6b6"/>
<text x="1262" y="1933" font-size="20" font-weight="bold" fill="#af7e04" text-anchor="middle">partly</text>
<text x="1214" y="1978" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">look.py reads the board on</text>
<text x="1214" y="2012" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">USB and checks it.</text>
<text x="1214" y="2046" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">deploy.py asks your yes</text>
<text x="1214" y="2080" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">first, or uses a deploy</text>
<text x="1214" y="2114" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">grant you gave once. With</text>
<text x="1214" y="2148" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">--no-simulation it flashes</text>
<text x="1214" y="2182" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">firmware/ that no</text>
<text x="1214" y="2216" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">simulation tested, on a</text>
<text x="1214" y="2250" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">typed yes only. It flashed</text>
<text x="1214" y="2284" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">a XIAO ESP32-C6 and read</text>
<text x="1214" y="2318" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">ready. On 2026-11-01 it</text>
<text x="1214" y="2352" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">flashed a FireBeetle 2</text>
<text x="1214" y="2386" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">ESP32-S3, deploy needed no</text>
<text x="1214" y="2420" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">reset press after the</text>
<text x="1214" y="2454" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">flash, and its button lit</text>
<text x="1214" y="2488" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">its LED. live.py runs</text>
<text x="1214" y="2522" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">Claude's code inside your</text>
<text x="1214" y="2556" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">grant. No wired breadboard</text>
<text x="1214" y="2590" font-size="24" font-weight="normal" fill="#595959" text-anchor="start">yet.</text>
<rect x="48" y="2652" width="1504" height="92" rx="12" fill="#1a1a1a"/>
<text x="72" y="2690" font-size="24" fill="#ffffff"><tspan font-weight="bold">Where we are:</tspan> the button-and-LED firmware read ready seen on a XIAO ESP32-C6 on 2026-10-15.</text>
<text x="72" y="2724" font-size="24" fill="#ffffff"><tspan font-weight="bold">Next:</tspan> wire its breadboard and press the button.</text>
</svg>
